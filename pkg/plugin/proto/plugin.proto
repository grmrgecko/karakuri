// The karakuri plugin wire protocol: how an external plugin process and the
// host talk: hashicorp/go-plugin over gRPC, with a brokered host-service
// callback channel.
//
// Messages lean on JSON blobs for everything the host already speaks JSON
// for — node metadata, configs, port sets, payloads — so the proto stays a
// transport, not a second schema. The one shape JSON cannot round-trip is a
// binary payload ([]byte decodes as a base64 string), which is why WireMsg
// carries the payload in two fields.
syntax = "proto3";

package karakuriplugin;

option go_package = "github.com/grmrgecko/karakuri/pkg/plugin/proto";

message Empty {}

// WireMsg is one engine.Msg on the wire.
message WireMsg {
  string id = 1;
  // payload_json holds the JSON-encoded payload when binary is false.
  bytes payload_json = 2;
  // payload_binary holds the raw bytes when the payload is []byte; binary
  // distinguishes an empty byte payload from an absent one.
  bytes payload_binary = 3;
  bool binary = 4;
  string topic = 5;
  bytes meta_json = 6;
  bytes group_json = 7;
  bool continuation = 8;
}

message WireMsgList { repeated WireMsg msgs = 1; }

message InitRequest {
  string host_version = 1;
  // host_service_id is the broker ID the plugin dials to reach KarakuriHost.
  uint32 host_service_id = 2;
}

message InitResponse {
  bool success = 1;
  string error = 2;
}

// Registrations is everything the plugin contributes, gathered by running its
// Register against a capturing registrar on the plugin side.
message Registrations {
  bytes manifest_json = 1;   // plugin.Manifest
  repeated NodeRegistration nodes = 2;
  repeated KindRegistration kinds = 3;
  bytes port_types_json = 4;   // []flow.PortTypeDef
  bytes controls_json = 5;     // []flow.FieldControlDef
  bytes ai_providers_json = 6; // []plugin.AIProviderDef
}

message NodeRegistration {
  bytes meta_json = 1; // flow.NodeMeta
  // trigger marks a node whose implementation satisfies engine.TriggerType.
  bool trigger = 2;
}

message KindRegistration {
  string kind = 1;
  string label = 2;
  bytes config_spec_json = 3; // []flow.FieldSpec
  repeated string secrets = 4;
  bool has_validate = 5;
  bool has_test = 6;
}

// ExecuteRequest runs one node. ctx_id names the host-side ExecContext the
// plugin's callbacks act against; config_json is the merged config (stored
// literals overlaid with pulled parameters), so Config never round-trips.
message ExecuteRequest {
  string ctx_id = 1;
  string node_type = 2;
  string node_id = 3;
  bytes config_json = 4;
  bytes ports_json = 5; // flow.PortSet
  map<string, WireMsg> inputs = 6;
  // Output ports at least one graph edge leaves, answering ExecContext.Wired
  // plugin-side. Stamped per execution because wiring is per placed node.
  repeated string wired_outputs = 7;
}

message ExecuteResponse {
  map<string, WireMsgList> outputs = 1;
  string error = 2;
}

// StartTrigger arms a trigger; each streamed event is one emitted message.
// The stream ends when Start returns, carrying its error in gRPC status.
message StartTriggerRequest {
  string ctx_id = 1;
  string node_type = 2;
  string node_id = 3;
  bytes config_json = 4;
  bytes ports_json = 5;
  repeated string wired_outputs = 6;
}

message TriggerEvent { WireMsg msg = 1; }

// StartDriver builds and starts a connection driver in the plugin process.
// The first streamed event acks the start (start_error set on failure, ending
// the stream); every later event is one status transition.
message StartDriverRequest {
  string kind = 1;
  string conn_id = 2;
  string name = 3;
  bytes config_json = 4;
}

message DriverEvent {
  string start_error = 1;
  DriverStatus status = 2;
}

message DriverStatus {
  string state = 1;
  string error = 2;
  string since = 3; // RFC3339
}

message DriverID { string conn_id = 1; }

message KindConfigRequest {
  string kind = 1;
  bytes config_json = 2;
}

message TestConnectionRequest {
  string kind = 1;
  string conn_id = 2;
  bytes config_json = 3;
}

// ErrorResponse carries an error, empty on success. detail is what a probing
// connection test found, such as the calendars an account holds.
message ErrorResponse {
  string error = 1;
  string detail = 2;
}

// ---- Settings, HTTP, and messaging ----
//
// A plugin that only brings nodes answers none of these: the host asks once
// and takes an empty schema, a 404, or a no-op as "does not contribute this".

message SettingsSchema {
  // json_schema describes the plugin's settings; empty means none. Every
  // property with a default is seeded into the host's settings store on load.
  string json_schema = 1;
}

message OpenAPISpec { string spec_json = 1; }

// HTTPRequest is one request the host proxied from /api/plugins/{name}/*.
// Path is the suffix after that prefix, so a plugin routes against its own
// namespace and never sees where it was mounted.
message HTTPRequest {
  string method = 1;
  string path = 2;
  map<string, string> headers = 3;
  bytes body = 4;
  string query_string = 5;
  string remote_addr = 6;
  // user_id and username are empty for an anonymous request; the host has
  // already resolved and verified them.
  string user_id = 7;
  string username = 8;
  // dashboard_grant is the ID of the dashboard the host authorized this
  // request against, empty when it authorized none. The dashboard's deployed
  // layout holds one of this plugin's widgets and its manifest names this
  // route, which is what lets a plugin route serve a viewer who holds no
  // plugin permission. It travels beside the headers rather than in them: the
  // host forwards a client's headers verbatim, and a claim a client could
  // write is not a grant.
  //
  // It carries the ID rather than a flag because a plugin route keyed by
  // dashboard has to check the two agree. The grant says which dashboard
  // authorized the request, not that some dashboard did.
  string dashboard_grant = 9;
  // key_limited says the caller authenticated with an API key limited to
  // key_permissions. A plugin's permission checks must also find the
  // permission there, because the host's check answers for the user alone.
  bool key_limited = 10;
  repeated string key_permissions = 11;
}

message HTTPResponse {
  int32 status_code = 1;
  map<string, string> headers = 2;
  bytes body = 3;
}

// MessageEvent delivers one broker message on a topic the plugin subscribed
// to. Subscription-count messages are how a plugin learns a dashboard is
// watching a topic and starts polling for it.
message MessageEvent {
  string topic = 1;
  string msg_type = 2;
  bytes payload = 3;
}

// KarakuriPlugin is what the host calls on the plugin process.
service KarakuriPlugin {
  rpc Init(InitRequest) returns (InitResponse);
  rpc GetRegistrations(Empty) returns (Registrations);
  rpc ExecuteNode(ExecuteRequest) returns (ExecuteResponse);
  rpc StartTrigger(StartTriggerRequest) returns (stream TriggerEvent);
  rpc StartDriver(StartDriverRequest) returns (stream DriverEvent);
  rpc StopDriver(DriverID) returns (Empty);
  rpc ValidateKindConfig(KindConfigRequest) returns (ErrorResponse);
  rpc TestKindConnection(TestConnectionRequest) returns (ErrorResponse);
  rpc GetSettingsSchema(Empty) returns (SettingsSchema);
  rpc GetOpenAPISpec(Empty) returns (OpenAPISpec);
  rpc HandleHTTP(HTTPRequest) returns (HTTPResponse);
  rpc HandleMessage(MessageEvent) returns (Empty);
  rpc Shutdown(Empty) returns (Empty);
}

// ---- Host service (plugin -> host callbacks) ----

message CtxKey {
  string ctx_id = 1;
  string key = 2;
  // durable addresses the node's persistent store instead of the
  // memory-only one.
  bool durable = 3;
}

message CtxSet {
  string ctx_id = 1;
  string key = 2;
  bytes value_json = 3;
  // clear distinguishes "set to null" from "delete" where the API differs.
  bool clear = 4;
  // durable addresses the node's persistent store instead of the
  // memory-only one.
  bool durable = 5;
}

message ScopedKey {
  string ctx_id = 1;
  string scope = 2;
  string key = 3;
}

message ScopedSet {
  string ctx_id = 1;
  string scope = 2;
  string key = 3;
  bytes value_json = 4;
  bool clear = 5;
}

message CtxOnly { string ctx_id = 1; }

// ValueResponse carries one JSON value plus whether it existed, for the
// lookups that report presence.
message ValueResponse {
  bytes value_json = 1;
  bool found = 2;
  string error = 3;
}

message EvalRequest {
  string ctx_id = 1;
  string src = 2;
  WireMsg msg = 3;
  bool has_msg = 4;
}

message DebugRequest {
  string ctx_id = 1;
  bytes payload_json = 2;
  string note = 3;
}

// StoreCAS is NodeStore.Update over a process boundary: the mutation closure
// runs plugin-side, so atomicity becomes compare-and-swap against the value
// the closure read, retried on conflict. expected/new use found/clear the way
// the store distinguishes absent keys from null values.
message StoreCASRequest {
  string ctx_id = 1;
  string key = 2;
  bytes expected_json = 3;
  bool expected_found = 4;
  bytes new_json = 5;
  bool delete = 6;
  // durable addresses the node's persistent store instead of the
  // memory-only one.
  bool durable = 7;
}

message StoreCASResponse {
  bool swapped = 1;
  bytes current_json = 2;
  bool current_found = 3;
}

// WaitRequest blocks: Park frees the host worker slot for the duration,
// ClockAfter waits on the host's injectable clock (so a fake clock in tests
// drives plugin nodes too). Cancellation rides the gRPC context.
message WaitRequest {
  string ctx_id = 1;
  int64 duration_ms = 2;
}

message EmitRequest {
  string ctx_id = 1;
  string port = 2;
  WireMsg msg = 3;
}

// ---- Plugin-scoped host callbacks ----
//
// Unlike the exec-context callbacks above, these are not tied to a run. The
// host knows which plugin is calling from the connection, and tags every
// registration with that name so unloading can reverse it.

message ConfigKey { string key = 1; }

message ConfigValue {
  string value = 1;
  bool found = 2;
}

message ConfigSet {
  string key = 1;
  string value = 2;
}

message PublishRequest {
  string topic = 1;
  string msg_type = 2;
  bytes payload = 3;
}

message TopicRequest { string topic = 1; }

message PermissionRequest {
  string permission = 1;
  repeated string actions = 2;
  string description = 3;
}

message PermissionName { string permission = 1; }

// RoleDefault grants a permission to named roles, or to every role, when a
// plugin loads for the first time. Existing grants are left alone.
message RoleDefault {
  string permission = 1;
  repeated string roles = 2;
  bool all_roles = 3;
}

message SeedRoleDefaultsRequest { repeated RoleDefault defaults = 1; }

message ProviderRequest {
  string type = 1;
  string name = 2;
  string endpoint = 3;
  string display_name = 4;
}

message ProviderName {
  string type = 1;
  string name = 2;
}

message TopicPermissionRequest {
  string pattern = 1;
  string permission = 2;
}

message TopicPermissionName { string pattern = 1; }

message PermissionCheck {
  string user_id = 1;
  string permission = 2;
}

message DashboardAccessCheck {
  string user_id = 1;
  string dashboard_id = 2;
  // level is view, edit, or admin; a grant implies every level below it.
  string level = 3;
}

message ConnectionAccessCheck {
  string user_id = 1;
  string connection_id = 2;
}

message AllowedResponse { bool allowed = 1; }

// ConnectionTokenRequest asks for a host connection's current access token.
message ConnectionTokenRequest { string conn_id = 1; }

// ConnectionTokenResponse carries the token, or why there is none.
message ConnectionTokenResponse {
  string token = 1;
  string error = 2;
}

// TriggerSkippedRequest records an event an armed trigger decided not to start
// a run for, such as an occurrence missed while the server was down.
message TriggerSkippedRequest {
  string ctx_id = 1;
  WireMsg msg = 2;
  string reason = 3;
}

// KarakuriHost is what the plugin calls back on the host, dialed through the
// go-plugin broker during Init.
service KarakuriHost {
  rpc Eval(EvalRequest) returns (ValueResponse);
  rpc Interpolate(EvalRequest) returns (ValueResponse);
  rpc Debug(DebugRequest) returns (Empty);
  rpc GetState(CtxKey) returns (ValueResponse);
  rpc SetState(CtxSet) returns (Empty);
  rpc GetVar(CtxKey) returns (ValueResponse);
  rpc SetVar(CtxSet) returns (Empty);
  rpc Vars(CtxOnly) returns (ValueResponse);
  rpc GetScoped(ScopedKey) returns (ValueResponse);
  rpc SetScoped(ScopedSet) returns (ErrorResponse);
  rpc ScopedVars(ScopedKey) returns (ValueResponse);
  rpc StoreGet(CtxKey) returns (ValueResponse);
  rpc StoreSet(CtxSet) returns (Empty);
  rpc StoreDelete(CtxKey) returns (Empty);
  rpc StoreCAS(StoreCASRequest) returns (StoreCASResponse);
  rpc Park(WaitRequest) returns (ErrorResponse);
  rpc ClockNow(Empty) returns (ValueResponse);
  rpc ClockAfter(WaitRequest) returns (Empty);
  rpc Emit(EmitRequest) returns (Empty);

  // Plugin-scoped: settings, messaging, and registrations.
  rpc GetConfig(ConfigKey) returns (ConfigValue);
  rpc SetConfig(ConfigSet) returns (ErrorResponse);
  rpc Publish(PublishRequest) returns (Empty);
  rpc Subscribe(TopicRequest) returns (ErrorResponse);
  rpc Unsubscribe(TopicRequest) returns (Empty);
  rpc RegisterPermission(PermissionRequest) returns (Empty);
  rpc UnregisterPermission(PermissionName) returns (Empty);
  rpc SeedRoleDefaults(SeedRoleDefaultsRequest) returns (ErrorResponse);
  rpc RegisterProvider(ProviderRequest) returns (Empty);
  rpc UnregisterProvider(ProviderName) returns (Empty);
  rpc RegisterTopicPermission(TopicPermissionRequest) returns (Empty);
  rpc UnregisterTopicPermission(TopicPermissionName) returns (Empty);
  rpc CheckPermission(PermissionCheck) returns (AllowedResponse);
  rpc CheckDashboardAccess(DashboardAccessCheck) returns (AllowedResponse);
  // CheckConnectionAccess answers whether a user may use one connection, so a
  // plugin listing or referencing host connections offers only those.
  rpc CheckConnectionAccess(ConnectionAccessCheck) returns (AllowedResponse);

  // ConnectionAccessToken returns an access token from a host connection
  // whose driver issues them (the oauth2 kind), since a plugin process cannot
  // hold a host driver.
  rpc ConnectionAccessToken(ConnectionTokenRequest) returns (ConnectionTokenResponse);
  // TriggerSkipped records a canceled run for an armed trigger's skipped event.
  rpc TriggerSkipped(TriggerSkippedRequest) returns (Empty);
}
