name: "calendar"
version: "0.1.0"
description: "Calendar events for dashboards and flows, from ICS feeds or Google Calendar."
author: "James Coleman"

# The gRPC executable: flow nodes, an HTTP API, settings, and reactive polling.
entryPoint: "calendar"

# The dashboard widget reading that API.
widgets:
  - name: "Calendar"
    packageName: "calendar"
    tagName: "calendar-widget"
    configTagName: "calendar-config"
    tags: ["calendar", "events", "time"]
    defaultProvider: "ics"
    # Events come from this plugin's own topic and API, and both are keyed by
    # placement, so each placement grants its viewers exactly its own events.
    # Source settings, refresh, and the connection list stay with editors.
    scope:
      topics:
        - "calendar:update:{dashboard}:{widget}"
      api:
        - "GET /{dashboard}/{widget}/data"
